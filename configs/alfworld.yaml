# InfoSkill ALFWorld Configuration

# ── Paths ──────────────────────────────────────────────────────────────────────
paths:
  alfworld_config: "envs/alfworld_base_config.yaml"   # AlfredTWEnv config
  skills_json: "skill_library/data/claude_style_skills.json"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"

# ── Model ──────────────────────────────────────────────────────────────────────
model:
  backbone: "/models/wanjh2/models/Qwen/Qwen2.5-7B-Instruct"
  hidden_size: 3584           # Qwen2.5-7B hidden dim (also STATE_DIM / SKILL_DIM)
  lora:
    r: 16
    lora_alpha: 32
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    lora_dropout: 0.05
    bias: "none"

# ── Fast Module (Encoder / Projector / Predictors) ────────────────────────────
fast:
  latent_dim: 64              # z_tilde dimension
  num_prefix: 8               # m: number of soft prefix tokens
  grounding_hidden_dim: 512   # GroundingDecoder LSTM hidden size（exp4 不用，
                                # T5GroundingDecoder 的 hidden_dim 用 T5 自己的
                                # d_model，见 t5_backbone）
  grounding_max_len: 64       # max tokens for grounding target (title + principle)
  # exp4: 热启动 Encoder/GroundingDecoder 用的预训练模型（真实 C4 语料预训练
  # 过，不是随机初始化；~15.6M 参数，量级对齐 tinybert）。encoder 和 decoder
  # 共享同一个实例（weight tying，见 train.py 的 build_fast_modules）。
  t5_backbone: "google/t5-efficient-tiny"
  t5_max_length: 256          # state_text/skill_text 的 T5 tokenize 上限
                                # （沿用旧 Qwen mean-pool 的默认值；新增截断
                                # 监控，见 models/encoder_t5.py TruncationMonitor）

# ── Loss weights (paper eq. 8) ────────────────────────────────────────────────
loss:
  alpha_fidelity: 0.1          # weight for fidelity loss
  alpha_rate: 0.0001           # weight for rate/KL loss（= 旧 alpha1×beta）
  alpha2: 0.01                 # weight for grounding loss

# exp4 不使用 decoder_type 开关（不走 lstm/transformer 分支）——
# GroundingDecoder 固定用 T5GroundingDecoder，见 train.py 的 build_fast_modules。

# ── GRPO / Rollout ────────────────────────────────────────────────────────────
rollout:
  group_size: 4               # G: parallel episodes per task
  tasks_per_batch: 2          # 一批 rollout 同时跑几个不同任务（默认1=每批一个GRPO组）。
                                # 2 = 同批跑2个任务×各4局，共享一次 generate() 提升
                                # rollout 吞吐；GRPO advantage 仍按组(group_size)独立算。
                                # 代价：N 翻倍 → update 阶段耗时约翻倍（净成本，实测
                                # update 峰值显存只取决于 mini_batch_size，不受此影响）。
  max_steps: 30                # max steps per episode
  max_new_tokens: 512         # LLM generation budget per step
  max_prompt_len: 8192        # per-step prompt hard cap (tokenizer max_length);
                                # right-side truncation would cut the admissible
                                # list + output instruction, so keep well above
                                # realistic prompt length (model ctx is 32k)
  temperature: 0.9
  top_p: 0.9
  history_len: 3              # how many past (obs, action) pairs to include in prompt

# ── Training ──────────────────────────────────────────────────────────────────
training:
  num_episodes: 14212          # total episodes (3553 games × 4)
  learning_rate: 1.0e-6        # 从 1e-4 改为论文值 1e-6——1e-4 比论文大 100 倍，
                                # 疑似是训练崩溃（loss/success_rate/skills 归零，
                                # LLM 输出退化为中日文/乱码）的主因，待验证。
                                # NOTE: PyYAML parses "1e-4" (no decimal point) as a
                                # string, not a float — always write "1.0e-4" style.
  grad_clip: 1.0
  batch_accumulation: 1
  mini_batch_size: 4           # bs：_fast_update() 每次 forward+backward 重算
                                # log_prob 的 mini-batch 大小（不是 rollout.group_size）。
                                # tpb=2 双任务混批后，update 峰值 ∝ 单批条数 × batch 内
                                # max(prompt+gen) 长度，随任务组合波动。8 在正式 run 里
                                # 大部分轮 OK，但 eval 后遇到长序列轮次（avg 125 tok/step）
                                # 仍 OOM（78.7GB + 4GB 碎片）。降到 4 单批激活再减半，
                                # 配合 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
                                # 消除 eval 后碎片；update 总耗时与 mbs 无关（总 FLOPs 恒定）。

  # Slow module
  slow_update_interval: 200   # T: steps between library maintenance runs
  mig_beta: 0.001             # beta used in MIG = Fidelity - beta*Rate for pruning

  # Checkpointing
  save_freq: 200              # save checkpoint every N episodes（每轮 episode 增量 =
                                # group_size × tasks_per_batch × world_size；阈值用
                                # "越过即触发"，所以只要不是增量更小的频繁值就不会
                                # 卡住，实际触发点可能比 N 稍晚几个 episode）
  eval_freq: 200              # run eval every N episodes（同上；"必须是 group_size
                                # 倍数"的旧描述是早期 % 判断的遗留，阈值式判断下
                                # 不受整除约束，但增量跨度应 < N 否则会跳过）
  eval_episodes: 140          # episodes for evaluation run (eval_in_distribution 共 140 个游戏)
  eval_batch_size: 1          # eval 多 episode 并行（默认1=串行；>1 如 4 时一次并行评估多局）

# ── Skill Library ─────────────────────────────────────────────────────────────
skill_library:
  top_k_task: 6               # K: task-specific skills retrieved per step (SkillRL K=6)
                              # general skills are always included in full
  max_skills: 200             # hard cap on library size
  skill_gen_batch: 5          # trajectories fed to Qwen per skill-generation call
  success_reward_threshold: 7.0  # reward >= 此值的成功轨迹才收集去生成新技能
                                  # reward = 10.0 - 0.1*step_count，7.0 对应 ≤30 步
                                  # （与 rollout.max_steps=30 对齐）；之前是 5.0（≤50 步）

# ── Device ────────────────────────────────────────────────────────────────────
device: "cuda"
seed: 42
