# InfoSkill ALFWorld Configuration

# ── Paths ──────────────────────────────────────────────────────────────────────
paths:
  alfworld_config: "envs/alfworld_base_config.yaml"   # AlfredTWEnv config
  skills_json: "skill_library/data/claude_style_skills.json"
  checkpoint_dir: "checkpoints_debug"
  log_dir: "logs_debug"

# ── Model ──────────────────────────────────────────────────────────────────────
model:
  backbone: "/root/workspaces/models/Qwen2.5-7B-Instruct"
  hidden_size: 3584           # Qwen2.5-7B hidden dim (also STATE_DIM / SKILL_DIM)
  lora:
    r: 16
    lora_alpha: 32
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    lora_dropout: 0.05
    bias: "none"

# ── Fast Module (Encoder / Projector / Predictors) ────────────────────────────
fast:
  latent_dim: 64              # z_tilde dimension
  num_prefix: 8               # m: number of soft prefix tokens
  grounding_hidden_dim: 512   # GroundingDecoder LSTM hidden size
  grounding_max_len: 64       # max tokens for grounding target (title + principle)

# ── Loss weights (paper eq. 8) ────────────────────────────────────────────────
loss:
  alpha_fidelity: 0.1          # weight for fidelity loss
  alpha_rate: 0.0001           # weight for rate/KL loss（= 旧 alpha1×beta）
  alpha2: 0.01                 # weight for grounding loss

# exp4 固定用 T5GroundingDecoder，不consult decoder_type（见 train.py 的
# build_fast_modules）；t5_backbone 沿用 configs/alfworld.yaml 的默认值
# google/t5-efficient-tiny（未在此显式覆盖）。

# ── GRPO / Rollout ────────────────────────────────────────────────────────────
rollout:
  group_size: 1          # 原来是 8，先降到 1 —— 每次 backward 前要同时留住这么多份
  tasks_per_batch: 1               # 一批 rollout 同时跑几个不同任务（默认1=每批一个GRPO组）
                         # 带梯度的 forward 计算图，是当前 OOM 的真正原因（不是
                         # 单纯的显存分配技巧问题），先降到最小跑通 debug 流程，
                         # 后续需要重构 rollout/update 的耦合方式才能真正支持
                         # group_size=8 的正式训练规模
  max_steps: 2           # 原来是 50/10 —— 同理，每多一步就多留一份计算图
  max_new_tokens: 32          # LLM generation budget per step
  temperature: 0.9
  top_p: 0.9
  history_len: 3              # how many past (obs, action) pairs to include in prompt

# ── Training ──────────────────────────────────────────────────────────────────
training:
  num_episodes: 5        # 原来是 5000，只跑 5 个 episode
  learning_rate: 1.0e-4
  grad_clip: 1.0
  batch_accumulation: 1
  mini_batch_size: 2            # debug 用小值，避免和 group_size=1/max_steps=2 不匹配

  # Slow module
  slow_update_interval: 3   # T: steps between library maintenance runs
  mig_beta: 0.001             # beta used in MIG = Fidelity - beta*Rate for pruning

  # Checkpointing
  save_freq: 5              # save checkpoint every N episodes
  eval_freq: 1000        # 先关掉/推后 eval，避免第一次就多跑一套 eval 流程
  eval_episodes: 64           # episodes for evaluation run
  eval_batch_size: 1          # eval 多 episode 并行（默认1=串行；>1 如 4 时一次并行评估多局）

# ── Skill Library ─────────────────────────────────────────────────────────────
skill_library:
  top_k_task: 6               # K: task-specific skills retrieved per step (SkillRL K=6)
                              # general skills are always included in full
  max_skills: 200             # hard cap on library size
  skill_gen_batch: 5          # trajectories fed to Qwen per skill-generation call

# ── Device ────────────────────────────────────────────────────────────────────
device: "cuda"
seed: 42
